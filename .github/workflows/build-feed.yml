name: Build Merchantee feed

on:
  schedule:
    # Každou hodinu v :45 (UTC), po hodinové aktualizaci Mergada v :30
    - cron: "45 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}merchantee.xml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate merchantee.xml from Mergado feed
        run: |
          mkdir -p public
          python merchantee_feed.py -o public/merchantee.xml
          touch public/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4

      # GitHub vypíná plánovaná spouštění po 60 dnech bez aktivity v repozitáři.
      # Tímto se workflow při každém běhu znovu povolí, takže poběží dál.
      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build-feed.yml/enable" || true
